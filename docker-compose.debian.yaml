name: luckfox-kvm-matrix

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: luckfox-kvm-matrix:1.4.1
    container_name: luckfox-kvm-matrix
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: 8787
      KVM_CONFIG: /app/kvm.config.json
    volumes:
      - ./kvm.config.json:/app/kvm.config.json:ro

  # Optional agent for scripts that should run on this same Debian host.
  host-script-agent:
    profiles: ["agent"]
    build:
      context: ./host-agent
      dockerfile: Dockerfile
    image: luckfox-host-script-agent:1.4.1
    container_name: luckfox-host-script-agent
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      AGENT_TOKEN: change-me-agent-token
      SCRIPTS_DIR: /scripts
      DEFAULT_SCRIPT_ID: host_action
      SCRIPT_TIMEOUT_SECONDS: 60
      HOST_PROC_PATH: /host/proc
      HOST_ROOT_PATH: /host/root
      STATS_MAX_PROCESSES: 8
      ALLOW_HOST_POWER_COMMANDS: "false"
      ALLOW_SYSRQ_FORCE: "false"
    volumes:
      - ./host-agent/scripts:/scripts
      - /proc:/host/proc:ro
      - /:/host/root:ro
    # Enable these only when host shutdown/reboot scripts are intentionally used.
    # privileged: true
    # pid: host
