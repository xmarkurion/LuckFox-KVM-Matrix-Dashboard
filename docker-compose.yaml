services:
  dashboard:
    # Build the image from this folder. No pre-existing/published image is required.
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: luckfox-kvm-matrix
    init: true
    restart: unless-stopped
    ports:
      # Bind to all host interfaces so other machines on the LAN can open http://<dashboard-host-ip>:8787.
      - "0.0.0.0:8787:8787"
    environment:
      NODE_ENV: production
      KVM_CONFIG: /app/kvm.config.json
      KVM_BACKUP_DIR: /app/backups
    volumes:
      # Mounted read-write so Settings can update the configuration.
      - ./kvm.config.json:/app/kvm.config.json
      - ./backups:/app/backups

    # If the container cannot reach 192.168.10.91-94 from Docker bridge networking,
    # uncomment the next line on Linux and remove/comment the ports section above.
    # network_mode: host