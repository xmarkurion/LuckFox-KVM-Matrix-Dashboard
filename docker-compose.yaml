services:
  luckfox-kvm-matrix:
    # Build the image from this folder. No pre-existing/published image is required.
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: luckfox-kvm-matrix
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      KVM_CONFIG: /app/kvm.config.json
    volumes:
      # Edit this file on the host to change KVM names, IPs, passwords, and notes.
      - ./kvm.config.json:/app/kvm.config.json:ro

    # Optional: uncomment if you want a stable local image tag after build.
    # image: luckfox-kvm-matrix:latest

    # If the container cannot reach 192.168.10.91-94 from Docker bridge networking,
    # uncomment the next line on Linux and remove/comment the ports section above.
    # network_mode: host


  # Optional local host script agent. Use this only when the script should run on
  # the same Docker host as the dashboard. For scripts on other target machines,
  # copy the host-agent folder to that target and run its own docker compose file.
  host-script-agent:
    profiles: ["agent"]
    build:
      context: ./host-agent
      dockerfile: Dockerfile
    container_name: luckfox-host-script-agent
    restart: unless-stopped
    ports:
      - "8799:8799"
    environment:
      AGENT_TOKEN: change-me-agent-token
      SCRIPT_PATH: /scripts/host_action.py
      SCRIPT_TIMEOUT_SECONDS: 60
      HOST_PROC_PATH: /host/proc
      HOST_ROOT_PATH: /host/root
      STATS_MAX_PROCESSES: 8
    volumes:
      - ./host-agent/scripts:/scripts
      # Optional host-stat mounts. These are read-only and let the agent report the host view,
      # not just the container view. Remove them if you only want container-visible stats.
      - /proc:/host/proc:ro
      - /:/host/root:ro
